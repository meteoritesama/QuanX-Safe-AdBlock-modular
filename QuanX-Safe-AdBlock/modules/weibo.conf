# Module: weibo
# App: 微博 / Weibo
# Mode: script-light
# Note: Native reject for dedicated ad endpoints + self-hosted conservative JSON cleaner.
#       No VIP unlock, skin/tab modification, persistent storage, or external network calls.

# Dedicated ad / popup endpoints
^https?:\/\/api\.weibo\.cn\/\d\/statuses\/container_positive url reject-200
^https?:\/\/api\.weibo\.cn\/\d\/push\/info url reject-200
^https?:\/\/api\.weibo\.cn\/.*account\/recommend_interesttags url reject-dict
^https?:\/\/api\.weibo\.cn\/.*\/media_homelist url reject-200
^https?:\/\/api\.weibo\.cn\/.*finder\/searchbarchange url reject-200
^https?:\/\/api\.weibo\.cn\/\d\/ad\/preload url reject-dict
^https?:\/\/api\.weibo\.cn\/\d\/profile\/recommend_popuser url reject-dict
^https?:\/\/boot.*weibo\.com\/v\d\/ad\/realtime url reject-200
^https?:\/\/api\.weibo\.cn\/.*discovery_home_bottom_getdotinfo url reject-dict
^https?:\/\/m?api\.weibo\.c(n|om)\/\d\/push\/daily url reject-dict
^https?:\/\/(preload-click|preload-impression)\.uve\.weibo\.com\/(interface\/wbpullad\/wbpullad_click\.php|wbapplua\/get_wbpullad_log\.lua) url reject
^https?:\/\/sdkapp\.uve\.weibo\.com\/interface\/sdk\/sdkconfig\.php url reject
^https?:\/\/m?api\.weibo\.c(n|om)\/\d\/hot\/hours_spotlight url reject-dict

# Mixed-content JSON endpoints: remove only explicit ad objects.
^https?:\/\/boot.*weibo\.com\/v\d\/ad\/preload url script-response-body https://raw.githubusercontent.com/meteoritesama/QuanX-Safe-AdBlock/main/QuanX-Safe-AdBlock/scripts/weibo_clean.js
^https?:\/\/api\.weibo\.cn\/\d\/statuses\/container_detail url script-response-body https://raw.githubusercontent.com/meteoritesama/QuanX-Safe-AdBlock/main/QuanX-Safe-AdBlock/scripts/weibo_clean.js
^https?:\/\/m?api\.weibo\.c(n|om)\/\d\/statuses\/(unread_)?friends(\/|_)timeline url script-response-body https://raw.githubusercontent.com/meteoritesama/QuanX-Safe-AdBlock/main/QuanX-Safe-AdBlock/scripts/weibo_clean.js
^https?:\/\/m?api\.weibo\.c(n|om)\/\d\/groups\/timeline url script-response-body https://raw.githubusercontent.com/meteoritesama/QuanX-Safe-AdBlock/main/QuanX-Safe-AdBlock/scripts/weibo_clean.js
^https?:\/\/m?api\.weibo\.c(n|om)\/\d\/statuses\/(container_timeline|unread_hot_timeline|video_mixtimeline|unread_topic_timeline) url script-response-body https://raw.githubusercontent.com/meteoritesama/QuanX-Safe-AdBlock/main/QuanX-Safe-AdBlock/scripts/weibo_clean.js
^https?:\/\/m?api\.weibo\.c(n|om)\/\d\/searchall url script-response-body https://raw.githubusercontent.com/meteoritesama/QuanX-Safe-AdBlock/main/QuanX-Safe-AdBlock/scripts/weibo_clean.js
^https?:\/\/m?api\.weibo\.c(n|om)\/\d\/search\/(finder|container_timeline|container_discover) url script-response-body https://raw.githubusercontent.com/meteoritesama/QuanX-Safe-AdBlock/main/QuanX-Safe-AdBlock/scripts/weibo_clean.js

hostname = api.weibo.cn, mapi.weibo.cn, api.weibo.com, mapi.weibo.com, boot*.weibo.com, preload-click.uve.weibo.com, preload-impression.uve.weibo.com, sdkapp.uve.weibo.com
