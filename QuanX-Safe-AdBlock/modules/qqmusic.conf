# Module: qqmusic
# App: QQ音乐 / QQ Music
# Mode: native
# Note: Keeps to dedicated splash/ad resources. No response-body JavaScript.

# QQ Music splash / targeted advertisement resources
^https?:\/\/us\.l\.qq\.com\/exapp url reject
^https?:\/\/y\.gtimg\.cn\/music\/common\/upload\/t_splash_info\/ url reject
^https?:\/\/y\.gtimg\.cn\/music\/common\/\/upload\/kg_ad\/.*?\d{4}\.jpg url reject-img
^https?:\/\/y\.gtimg\.cn\/music\/common\/upload\/targeted_ads url reject-img
^https?:\/\/y\.gtimg\.cn\/music\/.*?_Ad\/\d+\.png url reject-img

# Tencent Music dedicated advertising hosts
^https?:\/\/(adstats|ad|adcdn|adcdn6|adexpo|adclick)\.tencentmusic\.com\/ url reject
^https?:\/\/tmead(quic|bak)?\.y\.qq\.com\/ url reject

hostname = us.l.qq.com, y.gtimg.cn, adstats.tencentmusic.com, ad.tencentmusic.com, adcdn.tencentmusic.com, adcdn6.tencentmusic.com, adexpo.tencentmusic.com, adclick.tencentmusic.com, tmead.y.qq.com, tmeadquic.y.qq.com, tmeadbak.y.qq.com
