# Module: eleme
# App: 饿了么 / Ele.me
# Mode: native-media
# Note: focuses on known startup-ad media shapes; default disabled because
# dimension-based CDN patterns can become stale as the app changes.

^https?:\/\/elemecdn\.com\/.+\/sitemap url reject
^https?:\/\/fuss10\.elemecdn\.com\/.+?\.mp4 url reject
^https?:\/\/cube\.elemecdn\.com\/\w\/\w{2}\/\w+mp4\.mp4\? url reject
^https?:\/\/cube\.elemecdn\.com\/[\w\/]+\.jpeg\?x-oss-process=image\/resize,m_fill,w_1\d{3},h_2\d{3}\/format,webp\/ url reject-img
^https?:\/\/cube\.elemecdn\.com\/[\w\/]+\.jpeg\?x-oss-process=image\/resize,m_fill,w_6\d{2},h_8\d{2}\/format,webp\/ url reject-img
^https?:\/\/(nr-op|cube)\.elemecdn\.com\/.+\.jpeg\?x-oss-process=image\/resize,m_fill,w_\d{4,},h_\d{4,}\/(?:$|format,webp\/$) url reject-img

hostname = elemecdn.com, fuss10.elemecdn.com, cube.elemecdn.com, nr-op.elemecdn.com
