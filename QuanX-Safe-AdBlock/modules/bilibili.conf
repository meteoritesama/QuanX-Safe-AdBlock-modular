# Module: bilibili
# App: 哔哩哔哩 / Bilibili
# Mode: script-light
# Note: Uses only the repository's own small JSON cleaner; protobuf/gRPC remains out of scope.

^https?:\/\/app\.bilibili\.com\/x\/v2\/splash\/show url reject-dict
^https?:\/\/api\.bilibili\.com\/pgc\/activity\/deliver\/material\/receive url reject-dict
^https?:\/\/api\.bilibili\.com\/x\/vip\/ads\/material\/report url reject-dict
^https?:\/\/api\.bilibili\.com\/pgc\/season\/player\/cards url reject-dict
^https?:\/\/api\.bilibili\.com\/pgc\/season\/player\/ogv\/cards url reject-dict
^https?:\/\/manga\.bilibili\.com\/twirp\/comic\.v\d\.Comic\/(Flash|ListFlash|GetActivityTab) url reject-dict
^https?:\/\/app\.bilibili\.com\/x\/v\d\/search\/defaultwords url reject-dict
^https?:\/\/app\.bilibili\.com\/x\/v2\/splash\/list url script-response-body https://raw.githubusercontent.com/meteoritesama/QuanX-Safe-AdBlock/main/QuanX-Safe-AdBlock/scripts/bilibili_clean.js
^https?:\/\/app\.bilibili\.com\/x\/v2\/feed\/index(?:\?|$) url script-response-body https://raw.githubusercontent.com/meteoritesama/QuanX-Safe-AdBlock/main/QuanX-Safe-AdBlock/scripts/bilibili_clean.js
^https?:\/\/api\.live\.bilibili\.com\/xlive\/app-room\/v1\/index\/getInfoByRoom url script-response-body https://raw.githubusercontent.com/meteoritesama/QuanX-Safe-AdBlock/main/QuanX-Safe-AdBlock/scripts/bilibili_clean.js
^https?:\/\/api\.(bilibili|biliapi)\.(com|net)\/pgc\/page\/(bangumi|cinema\/tab) url script-response-body https://raw.githubusercontent.com/meteoritesama/QuanX-Safe-AdBlock/main/QuanX-Safe-AdBlock/scripts/bilibili_clean.js
^https?:\/\/api\.(bilibili|biliapi)\.(com|net)\/pgc\/season\/app\/related\/recommend\? url script-response-body https://raw.githubusercontent.com/meteoritesama/QuanX-Safe-AdBlock/main/QuanX-Safe-AdBlock/scripts/bilibili_clean.js

hostname = app.bilibili.com, api.bilibili.com, api.live.bilibili.com, api.biliapi.net, manga.bilibili.com
