# Module: netease
# App: 网易云音乐 / NetEase Cloud Music
# Mode: native

# --- 必须开启 MitM (HTTPS 解密) 的主机名 ---
# 确保在 QuanX 的 "MitM" 设置中已开启并信任证书
hostname = interface*.music.163.com, api.iplay.163.com

# --- 核心广告 API 拦截 (Rewrite) ---

# 1. 基础广告、开屏与切屏广告 (返回空字典防止App崩溃)
^https?:\/\/interface(\d)?\.music\.163\.com\/eapi\/ad\/.* url reject-dict
^https?:\/\/interface(\d)?\.music\.163\.com\/eapi\/v\d\/ad\/.* url reject-dict
^https?:\/\/interface(\d)?\.music\.163\.com\/eapi\/splash\/.* url reject-dict
^https?:\/\/interface(\d)?\.music\.163\.com\/e?api\/ad\/loading\/.* url reject-dict

# 2. 发现页、社区广场、资源曝光及活动弹窗
^https?:\/\/interface(\d)?\.music\.163\.com\/eapi\/resource-exposure\/.* url reject-dict
^https?:\/\/interface(\d)?\.music\.163\.com\/eapi\/socialsquare\/.* url reject-dict
^https?:\/\/interface(\d)?\.music\.163\.com\/eapi\/sp\/flow\/popup\/.* url reject-200
^https?:\/\/interface(\d)?\.music\.163\.com\/eapi\/link\/position\/show\/.* url reject-dict

# 3. 直播与游戏推广 (iplay 域名)
^https?:\/\/api\.iplay\.163\.com\/api\/mlivestream\/.* url reject-dict
^https?:\/\/api\.iplay\.163\.com\/api\/game\/.* url reject-dict
